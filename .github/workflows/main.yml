name: Build DLL

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      - name: Buscar .sln
        id: sln
        shell: pwsh
        run: |
          $f = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
          echo "path=$($f.FullName)" >> $env:GITHUB_OUTPUT

      - name: Compilar
        run: msbuild "${{ steps.sln.outputs.path }}" /p:Configuration=Release /p:Platform=x64 /m

      - uses: actions/upload-artifact@v4
        with:
          name: dll
          path: '**/Release/*.dll'
